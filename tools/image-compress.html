<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Compressor — ShrinkNest</title>

    <link rel="icon" href="../assets/favicon/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css?v=2.0">
    <link rel="stylesheet" href="../css/tools.css?v=2.0">

    <style>
        /* ── Image Upload & Drop Area ── */
        .image-upload-section {
            width: 100%;
            margin-bottom: 25px;
        }

        /* Override upload-box with vivid premium colors */
        .image-drop-zone.upload-box,
        .image-drop-zone {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100%;
            border: 2.5px dashed #7c71f5 !important;
            border-radius: 22px !important;
            padding: 44px 24px 34px !important;
            text-align: center;
            background: linear-gradient(145deg, #eef0ff 0%, #f0f4ff 50%, #e8f0fe 100%) !important;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.12) !important;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        .image-drop-zone.upload-box:hover,
        .image-drop-zone:hover {
            background: linear-gradient(145deg, #dfe3ff 0%, #e2eaff 50%, #d4e0ff 100%) !important;
            border-color: #6C63FF !important;
            transform: translateY(-3px) !important;
            box-shadow: 0 18px 40px rgba(108, 99, 255, 0.2) !important;
        }

        .image-drop-zone.dragover {
            background: linear-gradient(145deg, #dff3ff 0%, #e0f4ff 100%) !important;
            border-color: #00c6ff !important;
            border-style: solid !important;
            transform: scale(1.015) !important;
            box-shadow: 0 0 0 4px rgba(0, 198, 255, 0.3), 0 18px 40px rgba(108, 99, 255, 0.2) !important;
        }

        /* Centered Image Icon Badge */
        .image-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6C63FF 0%, #4F46E5 55%, #00c6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 16px;
            box-shadow: 0 12px 28px rgba(108, 99, 255, 0.4);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease;
        }

        .image-drop-zone:hover .image-icon-wrap {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 16px 34px rgba(108, 99, 255, 0.5);
        }

        .image-drop-zone.dragover .image-icon-wrap {
            transform: scale(1.12);
        }

        /* Headings & Subtitles */
        .image-drop-title {
            font-size: 22px;
            font-weight: 700;
            color: #2d2472;
            margin: 0 0 5px 0;
            letter-spacing: -0.2px;
        }

        .image-drop-sub {
            font-size: 14px;
            color: #5a6380;
            margin: 0 0 16px 0;
        }

        /* Modern Primary Browse Button */
        .image-browse-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: linear-gradient(135deg, #6C63FF 0%, #4F46E5 100%);
            color: #ffffff;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.38);
            margin-bottom: 16px;
            transition: all 0.25s ease;
            letter-spacing: 0.2px;
        }

        .image-drop-zone:hover .image-browse-btn {
            background: linear-gradient(135deg, #5B52E8 0%, #4338CA 100%);
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(108, 99, 255, 0.5);
        }

        /* Helper Text Pill */
        .image-helper-text {
            font-size: 12px;
            color: #4f46e5;
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.25);
            padding: 6px 16px;
            border-radius: 50px;
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .image-helper-text i {
            font-size: 11px;
            color: #6C63FF;
        }

        .image-drop-zone input[type="file"] {
            display: none;
        }

        /* ── File Info Panel ── */
        .image-file-info {
            margin-top: 16px;
            padding: 14px 20px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #dde2f5;
            border-left: 4px solid #6C63FF;
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .file-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .file-info-icon {
            font-size: 16px;
            color: #6C63FF;
            flex-shrink: 0;
        }

        .file-info-text {
            display: flex;
            align-items: baseline;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
        }

        .file-info-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            flex-shrink: 0;
        }

        .file-info-value {
            font-size: 13px;
            color: #64748b;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .image-drop-zone {
                padding: 36px 20px 28px;
            }

            .image-icon-wrap {
                width: 58px;
                height: 58px;
                font-size: 25px;
                border-radius: 16px;
                margin-bottom: 14px;
            }

            .image-drop-title {
                font-size: 20px;
            }
        }

        @media (max-width: 576px) {
            .tool-page {
                padding: 30px 0 50px;
            }

            .tool-container {
                padding: 24px 16px;
                border-radius: 20px;
            }

            .tool-title {
                margin-bottom: 24px;
            }

            .tool-title h1 {
                font-size: 24px;
                margin-bottom: 6px;
            }

            .tool-title p {
                font-size: 13px;
            }

            .image-drop-zone {
                padding: 28px 14px 22px;
                border-radius: 18px;
            }

            .image-icon-wrap {
                width: 50px;
                height: 50px;
                font-size: 22px;
                border-radius: 14px;
                margin-bottom: 12px;
            }

            .image-drop-title {
                font-size: 18px;
                margin-bottom: 3px;
            }

            .image-drop-sub {
                font-size: 13px;
                margin-bottom: 12px;
            }

            .image-browse-btn {
                padding: 9px 22px;
                font-size: 13px;
                margin-bottom: 14px;
            }

            .image-helper-text {
                font-size: 11px;
                text-align: center;
                justify-content: center;
            }

            .image-file-info {
                padding: 12px 14px;
                border-radius: 12px;
            }

            .file-info-item {
                width: 100%;
                justify-content: flex-start;
                gap: 8px;
            }

            .file-info-text {
                width: 100%;
                justify-content: space-between;
            }

            .file-info-label {
                font-size: 12px;
            }

            .file-info-value {
                font-size: 12px;
            }

            .controls {
                margin-top: 22px;
                gap: 16px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
                margin-top: 22px;
            }

            .action-buttons .btn {
                width: 100%;
                padding: 13px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .tool-container {
                padding: 20px 12px;
            }

            .image-drop-zone {
                padding: 22px 10px 18px;
            }

            .image-drop-title {
                font-size: 16px;
            }

            .image-browse-btn {
                padding: 8px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="container nav-container">

            <a href="../index.html" class="logo">
                🪺 <span>ShrinkNest</span>
            </a>

            <a href="../dashboard.html" class="btn btn-outline">
                ← Dashboard
            </a>

        </div>

    </nav>

    <!-- Tool -->
    <section class="tool-page">

        <div class="tool-container glass">

            <div class="tool-title">

                <h1>Image Compressor</h1>

                <p>Compress JPG, PNG and WEBP images without noticeable quality loss.</p>

            </div>

            <!-- Upload & File Info Section -->
            <div class="image-upload-section">
                <!-- Drop Zone -->
                <label class="image-drop-zone upload-box" id="uploadBox" for="imageFile">
                    <div class="image-icon-wrap">
                        <i class="fa-solid fa-images"></i>
                    </div>

                    <h3 class="image-drop-title">Drag &amp; Drop Images</h3>
                    <p class="image-drop-sub">or click to browse</p>

                    <span class="image-browse-btn">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i> Browse Images
                    </span>

                    <p class="image-helper-text">
                        <i class="fa-solid fa-shield-halved"></i> JPG, PNG, WEBP • Secure &amp; private
                    </p>

                    <input
                        type="file"
                        id="imageFile"
                        accept=".jpg,.jpeg,.png,.webp"
                        multiple>
                </label>

                <!-- Clean File Information Panel -->
                <div class="file-info image-file-info">
                    <div class="file-info-item">
                        <i class="fa-solid fa-weight-hanging file-info-icon"></i>
                        <div class="file-info-text">
                            <span class="file-info-label">Original Size:</span>
                            <span class="file-info-value" id="originalSize">0 KB</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Compression Mode Selection -->
            <div class="controls">
                <div class="control-group">
                    <label>Compression Method</label>
                    <div style="display: flex; gap: 20px; margin-bottom: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                            <input type="radio" name="compressMethod" value="quality" checked>
                            By Quality
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                            <input type="radio" name="compressMethod" value="size">
                            By Target Size (KB)
                        </label>
                    </div>
                </div>

                <!-- Quality Control -->
                <div class="control-group" id="qualityControlGroup">
                    <label for="qualitySlider">Compression Quality</label>
                    <input type="range" id="qualitySlider" min="0" max="100" value="80">
                </div>

                <!-- Size Control -->
                <div class="control-group" id="sizeControlGroup" style="display: none;">
                    <label for="targetSizeInput">Target Size (KB)</label>
                    <input type="number" id="targetSizeInput" min="1" placeholder="e.g. 200" value="200" style="padding: 12px; border-radius: 10px; border: 1px solid #ddd; outline: none; width: 100%;">
                </div>
            </div>

            <!-- Preview -->
            <div class="preview-grid">

                <div class="preview-box">

                    <h4>Original</h4>

                    <img
                        id="beforePreview"
                        src="../assets/images/image-icon.svg"
                        alt="Before">

                </div>

                <div class="preview-box">

                    <h4>Compressed</h4>

                    <img
                        id="afterPreview"
                        src="../assets/images/image-icon.svg"
                        alt="After">

                </div>

            </div>

            <!-- Buttons -->
            <div class="action-buttons">

                <button
                    id="compressBtn"
                    class="btn">

                    Compress Image

                </button>

                <button
                    id="downloadBtn"
                    class="btn btn-secondary"
                    style="display:none;">

                    Download Image

                </button>

            </div>
            <!-- Result -->
            <div
                id="resultCard"
                class="result-card"
                style="display:none;">

                <h3>Compression Result</h3>

                <p>
                    <strong>Compressed Size:</strong>
                    <span id="compressedSize">0 KB</span>
                </p>

                <p>
                    <strong>Space Saved:</strong>
                    <span id="savedPercent">0%</span>
                </p>

            </div>

            <!-- Back Button -->
            <div class="action-buttons">

                <a
                    href="../dashboard.html"
                    class="btn btn-secondary">

                    ← Back to Dashboard

                </a>

            </div>

        </div>

    </section>

    <!-- Image Compressor -->
    <script type="module" src="../js/navbar.js"></script>

    <!-- Image Compressor -->
    <script type="module" src="../js/image-compress.js"></script>

</body>

</html>
